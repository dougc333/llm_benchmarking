apiVersion: apps/v1
kind: Deployment
metadata: {name: ray-serve-llm}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: ray-serve-llm}}
  template:
    metadata:
      labels: {app: ray-serve-llm}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      containers:
        - name: ray
          image: rayproject/ray-llm:latest-py311-cu128
          command: [python, /app/enginebench_ray.py]
          env:
            - {name: MODEL_ID, value: Qwen/Qwen2.5-7B-Instruct}
            - {name: GPU_COUNT, value: "1"}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: hf-token, key: token, optional: true}
          ports: [{name: http, containerPort: 8000}]
          resources:
            requests: {cpu: "8", memory: 32Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "16", memory: 64Gi, nvidia.com/gpu: "1"}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: ray-app}}]
