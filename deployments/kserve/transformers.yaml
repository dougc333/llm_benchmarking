# Apply this instead of vllm.yaml to force the standard Transformers backend.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-transformers
  namespace: enginebench-kserve
spec:
  predictor:
    model:
      modelFormat: {name: huggingface}
      storageUri: hf://Qwen/Qwen2.5-7B-Instruct
      args: [--model_name=qwen, --backend=huggingface, --dtype=bfloat16]
      resources:
        requests: {cpu: "8", memory: 32Gi, nvidia.com/gpu: "1"}
        limits: {cpu: "16", memory: 64Gi, nvidia.com/gpu: "1"}
