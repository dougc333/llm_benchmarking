name: qwen-sft
kind: sft
# Point this at the upstream training entry point you have pinned. EngineBench
# records and executes it; it does not replace the trainer's own metrics.
command:
  - accelerate
  - launch
  - examples/scripts/sft.py
  - --model_name_or_path
  - Qwen/Qwen2.5-7B-Instruct
  - --dataset_name
  - YOUR_DATASET
  - --output_dir
  - checkpoints/qwen-sft
checkpoint: checkpoints/qwen-sft
output_dir: results/training
